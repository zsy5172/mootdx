[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mootdx"
version = "0.11.11"
description = "通达信数据读取接口."
readme = "README.md"
license = { text = "MIT license" }
requires-python = ">=3.11,<3.15"
authors = [
  { name = "bopo", email = "ibopo@126.com" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "click>=8.1,<9",
  "httpx>=0.25,<1",
  "mini-racer>=0.12,<1",
  "pandas>=2.2,<3",
  "prettytable>=3.5,<4",
  "tdxpy>=0.2.7,<0.3",
  "tenacity>=8.1,<10",
  "tqdm>=4.66,<5",
  "typing-extensions>=4.5,<5",
]

[project.urls]
Homepage = "https://www.mootdx.com"
Repository = "https://github.com/mootdx/mootdx"

[project.scripts]
mootdx = "mootdx.__main__:entry"

[dependency-groups]
dev = [
  "freezegun>=1.2.2",
  "mkdocs>=1.6.1",
  "nox>=2025.5.1",
  "pytest>=8.3.5",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
]
compat = []

[tool.hatch.build.targets.wheel]
packages = ["mootdx", "mootdx_next"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:warnings"
log_cli = 0
log_cli_level = "DEBUG"

[tool.commitizen]
tag_format = "v$version"
annotated_tag = true
changelog_file = "docs/history.md"
changelog_incremental = true
update_changelog_on_bump = true
version_provider = "pep621"
version_files = [
  "mootdx/__init__.py:__version__",
]

[tool.uv]
default-groups = ["dev"]
