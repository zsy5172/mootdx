[build-system]
requires = ["hatchling~=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "mootdx"
version = "0.11.11"
description = "通达信数据读取接口."
readme = "README.md"
license = { text = "MIT license" }
requires-python = ">=3.11,<3.15"
authors = [
  { name = "bopo", email = "ibopo@126.com" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "click~=8.3.2",
  "httpx~=0.28.1",
  "mini-racer~=0.14.1",
  "pandas~=3.0.2",
  "prettytable~=3.17.0",
  "tenacity~=9.1.4",
  "tqdm~=4.67.3",
  "typing-extensions~=4.15.0",
]

[project.optional-dependencies]
legacy = [
  "tdxpy~=0.2.7",
]

[project.urls]
Homepage = "https://www.mootdx.com"
Repository = "https://github.com/mootdx/mootdx"

[project.scripts]
mootdx = "mootdx.__main__:entry"

[dependency-groups]
dev = [
  "freezegun~=1.5.5",
  "mkdocs~=1.6.1",
  "nox~=2026.4.10",
  "pytest~=9.0.3",
  "pytest-cov~=7.1.0",
  "ruff~=0.15.10",
]
compat = []

[tool.hatch.build.targets.wheel]
packages = ["mootdx", "mootdx_next"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:warnings"
log_cli = 0
log_cli_level = "DEBUG"

[tool.commitizen]
tag_format = "v$version"
annotated_tag = true
changelog_file = "docs/history.md"
changelog_incremental = true
update_changelog_on_bump = true
version_provider = "pep621"
version_files = [
  "mootdx/__init__.py:__version__",
]

[tool.uv]
default-groups = ["dev"]
