name: Trading Session Live Matrix

on:
  schedule:
    # GitHub cron uses UTC: 02:00 UTC is 10:00 Asia/Shanghai.
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

jobs:
  trading-session-live:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv and nox
        run: python -m pip install --upgrade uv nox

      - name: Run trading-session live matrix
        run: uv run nox -s trading_session_live

      - name: Upload live artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-session-live-artifacts
          path: compat/artifacts
          if-no-files-found: error
